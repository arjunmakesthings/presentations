<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>all:</title>
<base target="_blank">
</head>
<body>
<h3>all:</h3>
<ul id="list"></ul>

<script>
fetch("https://api.github.com/repos/arjunmakesthings/presentations/contents/slides")
  .then(res => res.json())
  .then(files => {
    const list = document.getElementById("list");
    files
      .filter(file => file.name.endsWith(".html"))
      .sort((a, b) => {
        const a_dated = /^\d/.test(a.name);
        const b_dated = /^\d/.test(b.name);
        if (a_dated && !b_dated) return -1;
        if (!a_dated && b_dated) return 1;
        return b.name.localeCompare(a.name);
      })
      .forEach(file => {
        const list_item = document.createElement("li");
        const link = document.createElement("a");
        link.href = "slides/" + file.name;
        link.textContent = file.name.toLowerCase();
        list_item.appendChild(link);
        list.appendChild(list_item);
      });
  });
</script>
</body>
</html>
