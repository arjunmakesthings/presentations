  ## i argue that there <i>could</i> be more.

  ---

  class: middle 

  ## explore alternative paradigms for rule-based systems (currently cellular-automata) to be expressed in.

  ---

  ## this may include: 

  - redefining what a pixel may be (for cellular automata)
  - breaking away from the structure of a 2-dimensional grid
  - removing assumptions such as positions of a ‘pixel’ being static or that a ‘pixel’ may only change its light (and color)
  - that cellular automata must always be ‘seen’ (as opposed to ‘felt’).
  - … and so on.

  ---

  class: middle

  ## i envision a <mark>collection of small prototypes</mark> (perhaps <mark>no bigger than handling 5x5x5</mark> automata); each of which would be capable of ‘running’ any rule-based system in such a way that a person can compare the experience of the same automata on system-a versus system-b.

  ---

  class: middle

  ## all 'alternative-display' research focuses on how well a system represents an image. 
  ## we don't care about that — we care about the perceivable expression of a rule-set.
