## .grey[software-interpretations are always written in english, and then realized by a constructed algorithm. each interpretation has the following:]

## - thought -> the core idea to express from the system.

--
## - expression -> technical details on extracting & representing relevant data from the system.

--

## - parameters: some software-interpretations may be computationally heavier than others. so, we may modify parameters of the system to realize them.

# interpretation #1.5: born in pairs.

### thought: 
beings are destined to be with someone that they were born close to (in proximity & age). however, as they live out their lives, they may be close or separated in the world. thought is borrowed from the red thread of fate.

# interpretation #2.0: missed connections:

### thought:
we walk by so many people. when they are within a certain distance, we have a short window of time to connect with each other in physical-space, until we are distant again.

      let w = width;
      let h = height;
      const factor = gcd(w, h);
      w /= factor;
      h /= factor;

      const dynamicRatio = `${w}:${h}`;
